name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'next/pnpm-lock.yaml'

      - name: Install Dependencies
        working-directory: ./next
        run: pnpm install --frozen-lockfile

      - name: Run Type Checking
        working-directory: ./next
        run: pnpm typecheck

      - name: Build Next.js App
        working-directory: ./next
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
          TINA_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME }}
          NEXT_PUBLIC_SITE_DESCRIPTION: ${{ secrets.NEXT_PUBLIC_SITE_DESCRIPTION }}
          NEXT_PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_FORMSPREE_ENDPOINT }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: pnpm build

      - name: Ajouter le portfolio français statique
        run: mkdir -p ./next/out/fr && cp -R ./fr/. ./next/out/fr/

      - name: Disable Jekyll
        working-directory: ./next/out
        run: touch .nojekyll

      - name: Deploy to gh-pages Branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./next/out
          force_orphan: true

  security-and-audit:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'next/pnpm-lock.yaml'

      - name: Install Dependencies
        working-directory: ./next
        run: pnpm install --frozen-lockfile

      - name: Security Audit (Production only)
        working-directory: ./next
        run: pnpm audit --prod --audit-level=high

      - name: Run Vulnerability Checks
        working-directory: ./next
        run: pnpm exec audit-ci --config ./audit-ci.json
