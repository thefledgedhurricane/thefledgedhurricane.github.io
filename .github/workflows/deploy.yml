name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment to prevent race conditions
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'next/pnpm-lock.yaml'

      - name: Install Dependencies
        working-directory: ./next
        run: pnpm install --frozen-lockfile

      - name: Run Type Checking
        working-directory: ./next
        run: pnpm typecheck

      - name: Build Next.js App
        working-directory: ./next
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME }}
          NEXT_PUBLIC_SITE_DESCRIPTION: ${{ secrets.NEXT_PUBLIC_SITE_DESCRIPTION }}
          NEXT_PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_FORMSPREE_ENDPOINT }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: pnpm build

      - name: Disable Jekyll for static assets
        working-directory: ./next/out
        run: touch .nojekyll

      - name: Setup Pages Routing
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './next/out'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4

  security-and-audit:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'next/pnpm-lock.yaml'

      - name: Install Dependencies
        working-directory: ./next
        run: pnpm install --frozen-lockfile

      - name: Security Audit (Production only)
        working-directory: ./next
        run: pnpm audit --prod --audit-level=high

      - name: Run Vulnerability Checks
        working-directory: ./next
        run: pnpm exec audit-ci --config ./audit-ci.json
